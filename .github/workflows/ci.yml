name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check and lint
        run: npm run lint

      - name: Execute automated test suite (Unit & Integration)
        run: npm test

      - name: Build client and server bundles
        run: npm run build
